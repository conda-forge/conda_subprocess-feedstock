schema_version: 1

context:
  name: conda_subprocess
  version: 0.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/conda_subprocess-${{ version }}.tar.gz
  sha256: f3b34f22704d6cb7c43a87817d12c69607d89049a41382de5f04559a92c54e7c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - conda
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - conda >=26.3.1,<26.8.0
tests:
  - python:
      imports:
        - conda_subprocess
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Run a subprocess in a different conda environment.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/conda_subprocess

extra:
  recipe-maintainers:
    - jan-janssen
